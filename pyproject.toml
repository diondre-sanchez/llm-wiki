[project]
name = "llmwiki"
version = "0.1.0"
description = "Local-first LLM-maintained markdown wiki (Karpathy's LLM-Wiki pattern) with Ollama or Claude as the engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
claude = ["anthropic>=0.70"]

[project.scripts]
wiki = "llmwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki"]
